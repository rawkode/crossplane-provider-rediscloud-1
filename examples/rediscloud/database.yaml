apiVersion: subscription.redis.io/v1alpha1
kind: Database
metadata:
  name: example-database
spec:
  forProvider:
    # Reference to the subscription resource
    subscriptionIdRef:
      name: example-subscription
    name: my-redis-database
    protocol: redis
    memoryLimitInGb: 1
    dataPersistence: aof-every-1-second
    throughputMeasurementBy: operations-per-second
    throughputMeasurementValue: 10000
    replication: true
    modules:
      - name: RedisJSON
      - name: RedisSearch
    alert:
      - name: connections-limit
        value: 80
      - name: dataset-size
        value: 80
  providerConfigRef:
    name: default